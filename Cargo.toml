[package]
name = "pisim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/compute",
    "crates/device",
    "crates/linalg",
    "crates/solver",
    "crates/cache",
    "crates/analysis",
    "crates/parser",
    "crates/utility",
    "crates/io",
    "crates/test-harness",
    "crates/osdi",
    "crates/digital",
    "crates/cosim",
    "crates/bench-suite",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0"
rust-version = "1.85.0"

[workspace.dependencies]
# Internal crates
pisim-core = { path = "crates/core" }
pisim-compute = { path = "crates/compute" }
pisim-device = { path = "crates/device" }
pisim-linalg = { path = "crates/linalg" }
pisim-solver = { path = "crates/solver" }
pisim-cache = { path = "crates/cache" }
pisim-analysis = { path = "crates/analysis" }
pisim-parser = { path = "crates/parser" }
pisim-utility = { path = "crates/utility" }
pisim-io = { path = "crates/io" }
pisim-test-harness = { path = "crates/test-harness" }
pisim-osdi = { path = "crates/osdi" }
pisim-digital = { path = "crates/digital" }
pisim-cosim = { path = "crates/cosim" }
pisim-bench-suite = { path = "crates/bench-suite" }

# External
ahash = { version = "0.8", features = ["serde"] }
smallvec = { version = "1.13", features = ["union", "const_generics", "serde"] }
bitvec = { version = "1.0", features = ["serde"] }
thiserror = "2"
log = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
toml = "0.8"
csv = "1.3"
tempfile = "3"
glob = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

[dev-dependencies]
pisim-test-harness = { path = "crates/test-harness" }
pisim-core = { path = "crates/core" }
pisim-parser = { path = "crates/parser" }
pisim-device = { path = "crates/device" }
pisim-solver = { path = "crates/solver" }
pisim-analysis = { path = "crates/analysis" }
pisim-cache = { path = "crates/cache" }
pisim-compute = { path = "crates/compute" }
pisim-linalg = { path = "crates/linalg" }
pisim-cosim = { path = "crates/cosim" }
pisim-digital = { path = "crates/digital" }
pisim-osdi = { path = "crates/osdi" }
criterion = { workspace = true }
tempfile = { workspace = true }
libloading = "0.8"

[[bench]]
name = "sparse_lu"
harness = false

[[bench]]
name = "newton_raphson"
harness = false

[[bench]]
name = "device_eval"
harness = false

[[bench]]
name = "end_to_end"
harness = false

