[package]
name = "incspice"
edition.workspace = true
version.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/netlist",
    "crates/solver",
    "crates/cache",
    "crates/analysis",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0"
rust-version = "1.85.0"

[workspace.dependencies]
incspice-core = { path = "crates/core" }
incspice-parser = { path = "crates/netlist" }
incspice-solver = { path = "crates/solver" }
incspice-cache = { path = "crates/cache" }
incspice-analysis = { path = "crates/analysis" }

# Data-Oriented
fixedbitset = "0.5"
soa_derive = "0.14"
soa-rs = "0.2"
thunderdome = "0.6"
slotmap = "1"
bumpalo = "3.20"
typed-index-collections = "3.5"
indexmap = "2"
wide = "1.3"
phf = { version = "0.11", features = ["macros"] }
ahash = { version = "0.8", features = ["serde"] }
smallvec = { version = "1.13", features = ["union", "const_generics", "serde"] }
arrayvec = "0.7"
compact_str = "0.8"
memchr = "2"
string-interner = "0.17"
bitvec = { version = "1.0", features = ["serde"] }
hecs = "0.10"

# GPU-Acceleration
wgpu = "25"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

# External
thiserror = "2"
log = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
toml = "0.8"
csv = "1.3"
crossbeam-channel = "0.5"
libloading = "0.8"
tempfile = "3"
glob = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dependencies]
incspice-core     = { workspace = true }
incspice-parser   = { workspace = true }
incspice-solver   = { workspace = true }
incspice-cache    = { workspace = true }
incspice-analysis = { workspace = true }

[dev-dependencies]
tempfile        = { workspace = true }
glob            = { workspace = true }
serde_json      = { workspace = true }
criterion       = { workspace = true }

[[test]]
name = "test_external"
path = "tools/test_external.rs"
harness = true

[[bench]]
name = "bench_external"
path = "tools/bench_external.rs"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.test]
opt-level = 3

[profile.bench]
inherits = "release"
strip = "none"
