[package]
name = "bigospice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/compute",
    "crates/device",
    "crates/linalg",
    "crates/solver",
    "crates/cache",
    "crates/analysis",
    "crates/parser",
    "crates/utility",
    "crates/io",
    "crates/osdi",
    "crates/digital",
    "crates/cosim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0"
rust-version = "1.85.0"

[workspace.dependencies]
# Internal crates
bigospice-core = { path = "crates/core" }
bigospice-compute = { path = "crates/compute" }
bigospice-device = { path = "crates/device" }
bigospice-linalg = { path = "crates/linalg" }
bigospice-solver = { path = "crates/solver" }
bigospice-cache = { path = "crates/cache" }
bigospice-analysis = { path = "crates/analysis" }
bigospice-parser = { path = "crates/parser" }
bigospice-utility = { path = "crates/utility" }
bigospice-io = { path = "crates/io" }
bigospice-osdi = { path = "crates/osdi" }
bigospice-digital = { path = "crates/digital" }
bigospice-cosim = { path = "crates/cosim" }

# External
ahash = { version = "0.8", features = ["serde"] }
smallvec = { version = "1.13", features = ["union", "const_generics", "serde"] }
bitvec = { version = "1.0", features = ["serde"] }
thiserror = "2"
log = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
toml = "0.8"
csv = "1.3"
tempfile = "3"
glob = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
phf = { version = "0.11", features = ["macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

[dev-dependencies]
bigospice-core = { path = "crates/core" }
bigospice-parser = { path = "crates/parser" }
bigospice-device = { path = "crates/device" }
bigospice-solver = { path = "crates/solver" }
bigospice-analysis = { path = "crates/analysis" }
bigospice-cache = { path = "crates/cache" }
bigospice-compute = { path = "crates/compute" }
bigospice-linalg = { path = "crates/linalg" }
bigospice-cosim = { path = "crates/cosim" }
bigospice-digital = { path = "crates/digital" }
bigospice-osdi = { path = "crates/osdi" }
bigospice-io = { path = "crates/io" }
criterion = { workspace = true }
tempfile = { workspace = true }
libloading = "0.8"
csv = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
glob = { workspace = true }
toml = { workspace = true }

[[bench]]
name = "suite"
path = "benches/suite.rs"
harness = false

[[test]]
name = "linalg"
path = "tests/suite/linalg.rs"

[[test]]
name = "solver"
path = "tests/suite/solver.rs"

[[test]]
name = "device"
path = "tests/suite/device.rs"

[[test]]
name = "analysis"
path = "tests/suite/analysis.rs"

[[test]]
name = "parser"
path = "tests/suite/parser.rs"

[[test]]
name = "cache"
path = "tests/suite/cache.rs"

[[test]]
name = "io"
path = "tests/suite/io.rs"

[[test]]
name = "cosim"
path = "tests/suite/cosim.rs"

[[test]]
name = "osdi"
path = "tests/suite/osdi.rs"

[[test]]
name = "golden"
path = "tests/suite/golden.rs"

[[test]]
name = "compat"
path = "tests/suite/compat.rs"

[[test]]
name = "external"
path = "tests/external/test_external.rs"
