name: Weekly Stress Tests

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  stress-test:
    name: Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev libopenblas-dev ngspice
      - name: Run all tests including ignored
        env:
          BIGOSPICE_HAVE_SIMS: "1"
        run: cargo test --workspace -- --include-ignored
        continue-on-error: true
      - name: Run full benchmark suite
        run: cargo bench --bench suite
        continue-on-error: true

  benchmark-compare:
    name: Benchmark vs ngspice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev libopenblas-dev ngspice
      - name: Head-to-head comparison
        env:
          BIGOSPICE_HAVE_SIMS: "1"
        run: cargo bench --bench suite -- compare --output-format bencher | tee compare-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compare-results-${{ github.run_id }}
          path: compare-results.txt
