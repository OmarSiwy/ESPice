name: nix

# Builds the flake's espice and pushes it to the omarsiwy cache, so
# `nix run github:OmarSiwy/ESPice` is a download, not a Zig compile.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: omarsiwy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Fork PRs cannot read the secret: build, do not push.
          skipPush: ${{ github.event_name == 'pull_request' }}

      # checks = the package build plus a smoke run of a plain and an .hdl deck.
      - run: nix flake check --print-build-logs
      - run: nix build .#espice --print-build-logs
      - run: nix run . -- --version
