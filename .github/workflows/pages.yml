name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
      - "include/espice.h"
      - "tools/playground/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The C API guide's host program, docs/embed/host.c: compiled against
      # libespice.a and run, so the documented example keeps working.
      - name: C API example
        run: zig build c-example -Dgpu=false

      # The in-browser playground (tools/playground/): espice.wasm and
      # cktimg.wasm, served from docs/wasm/ next to javascripts/playground.js.
      # Not yet required: until the playground build lands, the site
      # publishes without it and the Run buttons stay inert.
      - name: Playground
        continue-on-error: true
        run: |
          zig build wasm
          mkdir -p docs/wasm
          cp zig-out/wasm/*.wasm docs/wasm/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MkDocs
        run: |
          pip install "mkdocs==1.6.1" "mkdocs-material==9.7.6"
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
