name: test

# The merge gate (TESTING.md § Gates): every unit suite, the codegen probes,
# the fitness check and the full fixture corpus with its verdict name list,
# in the shipped mode (ReleaseSafe: LLVM with every safety check on).
# ponytail: no Debug job. Debug builds use the self-hosted backend, which
# diverges from LLVM (#25: numeric results, a pthread_create EINVAL, an
# allocation count); add `zig build test -Doptimize=Debug` once #25 closes.
# ponytail: x86_64-linux CPU only; the GPU corpus (`zig build test-gpu`) needs
# an NVIDIA runner and runs locally until one exists (TESTING.md, nightly).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: omarsiwy
          skipPush: true
      - run: nix develop .#ci -c zig build test -Dgpu=false -Doptimize=ReleaseSafe --summary failures
